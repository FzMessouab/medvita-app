services:
  db:
    image: postgres:16-alpine
    container_name: medvita-db
    environment:
      POSTGRES_DB: medical_equipment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_equipment_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medvita-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*,http://frontend:3000
      SPRING_PROFILES_ACTIVE: dev,docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/medical_equipment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
    ports:
      - "8080:8080"
    volumes:
      - invoices-data:/app/invoices
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://app:8080
    container_name: medvita-frontend
    depends_on:
      app:
        condition: service_started
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: /backend-api
      BACKEND_API_URL: http://app:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  invoices-data:
